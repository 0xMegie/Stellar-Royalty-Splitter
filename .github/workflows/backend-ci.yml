name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  validate-version:
    name: Validate Release Version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Validate versions
        run: |
          FRONTEND_VERSION=$(node -e "console.log(require('./frontend/package.json').version)")
          BACKEND_VERSION=$(node -e "console.log(require('./backend/package.json').version)")

          echo "Frontend version: $FRONTEND_VERSION"
          echo "Backend version: $BACKEND_VERSION"

          # Validate semantic versioning
          if ! [[ $FRONTEND_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid frontend version: $FRONTEND_VERSION"
            exit 1
          fi
          if ! [[ $BACKEND_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid backend version: $BACKEND_VERSION"
            exit 1
          fi

          # Check versions match (major.minor must align)
          FRONTEND_MM=$(echo $FRONTEND_VERSION | cut -d. -f1-2)
          BACKEND_MM=$(echo $BACKEND_VERSION | cut -d. -f1-2)
          if [ "$FRONTEND_MM" != "$BACKEND_MM" ]; then
            echo "Version mismatch: frontend $FRONTEND_VERSION, backend $BACKEND_VERSION"
            exit 1
          fi

          echo "✅ Version validation passed"

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: false

      - name: Upload coverage (Node 20.x)
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/coverage-final.json
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
