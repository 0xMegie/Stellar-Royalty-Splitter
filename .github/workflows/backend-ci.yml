name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit + integration tests
        run: npm test

      - name: Run chaos tests (#782)
        # Chaos suite exercises retryBuildTx, withTimeout, Horizon
        # connectivity under adversarial conditions (cascading failures,
        # timeouts, 429 rate-limits, concurrent lock release on failure).
        # Runs after unit tests so failures are clearly attributable.
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --testPathPatterns="tests/chaos"
