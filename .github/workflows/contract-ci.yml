name: Contract CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "test_snapshots/**"
      - ".github/workflows/contract-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "test_snapshots/**"
      - ".github/workflows/contract-ci.yml"

jobs:
  validate-version:
    name: Validate Release Version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Validate versions
        run: |
          FRONTEND_VERSION=$(node -e "console.log(require('./frontend/package.json').version)")
          BACKEND_VERSION=$(node -e "console.log(require('./backend/package.json').version)")

          echo "Frontend version: $FRONTEND_VERSION"
          echo "Backend version: $BACKEND_VERSION"

          # Validate semantic versioning
          if ! [[ $FRONTEND_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid frontend version: $FRONTEND_VERSION"
            exit 1
          fi
          if ! [[ $BACKEND_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid backend version: $BACKEND_VERSION"
            exit 1
          fi

          # Check versions match (major.minor must align)
          FRONTEND_MM=$(echo $FRONTEND_VERSION | cut -d. -f1-2)
          BACKEND_MM=$(echo $BACKEND_VERSION | cut -d. -f1-2)
          if [ "$FRONTEND_MM" != "$BACKEND_MM" ]; then
            echo "Version mismatch: frontend $FRONTEND_VERSION, backend $BACKEND_VERSION"
            exit 1
          fi

          echo "✅ Version validation passed"

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: false

  build:
    name: Build (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release
        continue-on-error: false

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Run tests
        run: cargo test --workspace --locked --features testutils test_storage_snapshot -- --nocapture
        continue-on-error: false
