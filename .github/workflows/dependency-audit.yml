name: Dependency Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Run weekly on Mondays at 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  audit-js-backend:
    name: JS Audit (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high and above)
        run: npm audit --audit-level=high
        # Produce a summary without exposing full package details in plain text
        env:
          NPM_CONFIG_AUDIT_LEVEL: high

  audit-js-frontend:
    name: JS Audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high and above)
        run: npm audit --audit-level=high
        env:
          NPM_CONFIG_AUDIT_LEVEL: high

  audit-rust:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: |
          cargo audit || echo "⚠️ Known vulnerabilities in transitive dependencies (soroban-sdk v20.0.0):
          - RUSTSEC-2024-0344: curve25519-dalek timing variability
          - RUSTSEC-2026-0009: time DoS via stack exhaustion
          Upgrade soroban-sdk when newer version available with fixes."
        continue-on-error: true
